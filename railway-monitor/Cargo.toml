[package]
name = "railway-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Telegram MTProto client
grammers = { version = "0.15", features = ["bin", "tokio"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client for Bale API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Database (for local session storage)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }