[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/session-bot",
    "crates/main-bot",
    "crates/telegram-poller",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kiarash"]
license = "MIT"

[workspace.dependencies]
# Cloudflare Workers
worker = "0.4"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Telegram MTProto
grammers-client = "0.7"
grammers-session = "0.7"
grammers-tl-types = "0.7"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
base64 = "0.22"
hex = "0.4"

# Fix for wasm target
getrandom = { version = "0.2", features = ["js"] }
