[workspace]
resolver = "2"
members = [
    "crates/main-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Kiarash"]
license = "MIT"

[workspace.dependencies]
# Cloudflare Workers
worker = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
base64 = "0.22"

# Fix for wasm target
getrandom = { version = "0.2", features = ["js"] }
